<!DOCTYPE html>
<!-- kmoosa homepage. Two colours: #543920 brown, #feeac7 cream.
     One screen. Click the cat: it and the name slide into the right half, and a
     tilted menu box unfolds to fill the left half, sized to match the cat.
     Nothing fades out. -->
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#feeac7" id="tc">
<title>Khalid Moosa — software engineer</title>
<meta name="description" content="Khalid Moosa, software engineer in Chantilly, Virginia.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&family=Silkscreen&family=VT323&display=swap" rel="stylesheet">
<style>
  :root{ --bg:#feeac7; --ink:#543920; --scan:rgba(84,57,32,.085); color-scheme:light; }
  :root[data-theme="dark"]{ --bg:#543920; --ink:#feeac7; --scan:rgba(254,234,199,.06); color-scheme:dark; }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:"Pixelify Sans","Silkscreen",monospace;
    overflow:hidden;
    transition:background 220ms linear, color 220ms linear;
  }

  /* ---------------- scanlines ---------------- */
  body::before{
    content:""; position:fixed; inset:0; z-index:9; pointer-events:none;
    background:repeating-linear-gradient(0deg, var(--scan) 0 1px, transparent 1px 3px);
  }
  body::after{
    content:""; position:fixed; left:0; right:0; height:38vh; top:-38vh;
    z-index:8; pointer-events:none;
    background:linear-gradient(180deg, transparent, var(--scan), transparent);
    animation:sweep 7.5s linear infinite;
  }
  @keyframes sweep{ to{ transform:translateY(calc(100vh + 38vh)); } }

  .skip{
    position:fixed; left:1rem; top:-4rem; z-index:20;
    background:var(--ink); color:var(--bg); padding:.6rem 1rem;
    font-family:"Silkscreen",monospace; font-size:.8rem; text-decoration:none;
    transition:top 140ms linear;
  }
  .skip:focus{top:1rem}

  /* ---------------- mode, pinned to the corner ---------------- */
  .mode{
    position:fixed; right:1.5rem; bottom:1.5rem; z-index:12;
    font-family:"Silkscreen",monospace; font-size:.78rem; letter-spacing:.14em;
    color:var(--ink); background:none; border:1px dashed var(--ink);
    padding:.55rem .9rem; cursor:pointer;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  .mode:hover{background:var(--ink); color:var(--bg)}

  .stage{position:relative; height:100%}

  /* ---------------- cat + name: one group, so nothing has to disappear ------- */
  .group{
    position:absolute; left:50%; top:46%;
    transform:translate(-50%,-50%);
    display:flex; flex-direction:column; align-items:center; gap:2.6rem;
    z-index:3;
    transition:transform 380ms cubic-bezier(.34,1.28,.5,1);
  }
  .stage[data-open="true"] .group{ transform:translate(calc(-50% + 25vw),-50%); }

  #cat{
    font-family:"VT323","Cascadia Mono",Consolas,monospace;
    white-space:pre; font-size:clamp(2.2rem,4.6vw,3.4rem); line-height:1.06;
    letter-spacing:.02em;
    color:var(--ink); background:none; border:0; padding:.5rem .7rem; cursor:pointer;
    -webkit-user-select:none; user-select:none;
    touch-action:manipulation; -webkit-tap-highlight-color:transparent;
  }
  #cat .eye{display:inline-block; width:1ch; text-align:center;
            transition:transform 90ms linear}

  /* a short digital tear, so the cat reads as a display rather than a drawing */
  @keyframes glitch{
    0%,100%{transform:none}
    22%{transform:translateX(-5px) skewX(-8deg)}
    34%{transform:translateX(6px) skewX(7deg)}
    46%{transform:translateX(-2px)}
    58%{transform:none}
  }
  #cat.glitching{animation:glitch 300ms steps(2,end) 1}

  .name{text-align:center; white-space:nowrap}
  .name h1{
    margin:0; font-weight:600;
    font-size:clamp(1.9rem,4.2vw,3.2rem); letter-spacing:.28em; text-indent:.28em;
  }
  .name .role{
    display:block; margin-top:1.2em;
    font-family:"Silkscreen",monospace; font-size:clamp(.68rem,1.15vw,.88rem);
    letter-spacing:.2em; text-indent:.2em;
  }
  .name .hint{
    display:block; margin-top:1.5em;
    font-family:"Silkscreen",monospace; font-size:clamp(.62rem,1vw,.76rem);
    letter-spacing:.2em; text-indent:.2em; opacity:.75;
  }

  /* ---------------- the navigation: the whole left half ---------------- */
  .nav{
    position:absolute; left:0; top:0; z-index:2;
    width:50vw; height:100%;
    overflow:hidden;
    perspective:70rem; perspective-origin:100% 46%;
    font-family:"Silkscreen",monospace;
    font-size:clamp(1.6rem,4.6vw,3.6rem); line-height:1.34;
    opacity:0; visibility:hidden; pointer-events:none;
    transition:opacity 180ms linear, visibility 0s linear 340ms;
  }
  /* --nav-top / --nav-h are measured off the cat group in script, so the near
     edge of the box lines up with the cat's ears and the CLICK THE CAT line. */
  .nav ul{
    position:absolute;
    right:clamp(1.5rem,4.5vw,4.5rem);
    top:var(--nav-top,26%); height:var(--nav-h,44%);
    width:min(30rem,40vw);
    display:flex; flex-direction:column; justify-content:space-between;
    border:1px dashed var(--ink);
    padding:clamp(.7rem,1.4vw,1.3rem) clamp(1rem,2.2vw,2rem);
    transform-origin:100% 0;
    transform:rotateY(22deg) scaleY(.02);
    transition:transform 340ms cubic-bezier(.2,.85,.3,1);
  }
  .stage[data-open="true"] .nav{
    opacity:1; visibility:visible; pointer-events:auto;
    transition-delay:260ms, 0s;   /* let the cat move first */
  }
  .stage[data-open="true"] .nav ul{
    transform:rotateY(22deg) scaleY(1);
    transition-delay:260ms;
  }
  .nav ul{list-style:none; margin:0}
  .nav a{
    display:block; white-space:nowrap; color:var(--ink);
    padding:1px 5px; text-decoration:none; text-align:right;
  }
  .nav a:hover,.nav a:focus-visible{background:var(--ink); color:var(--bg)}
  .nav{scrollbar-width:thin; scrollbar-color:var(--ink) transparent}
  .nav::-webkit-scrollbar{width:6px}
  .nav::-webkit-scrollbar-track{background:transparent}
  .nav::-webkit-scrollbar-thumb{background:var(--ink)}

  :focus-visible{outline:2px dashed var(--ink); outline-offset:4px}

  /* Reduced motion: drop the perspective and show a plain upright list. The tilt
     is decorative and it is the one thing here that genuinely hurts legibility. */
  @media (prefers-reduced-motion:reduce){
    *{animation:none!important; transition:none!important}
    .nav{perspective:none}
    .nav ul,.stage[data-open="true"] .nav ul{transform:none}
    .nav ul{justify-content:space-around}
    .stage[data-open="true"] .group{transform:translate(calc(-50% + 25vw),-50%)}
  }

  /* ----------------------------------------------------------------------
     Phones get an upright list, not the wedge. The perspective wastes a large
     empty triangle, and it made the furthest item the smallest tap target.
     The page also becomes a normal scrolling document, so the menu can never
     be squeezed off a short screen.
     ---------------------------------------------------------------------- */
  @media (max-width:900px){
    body{overflow-y:auto; overflow-x:hidden}

    /* Top-aligned, and the list sits AFTER the cat in the flow. Opening the menu
       then only adds height below it - the cat never slides out from under the
       finger that just tapped it. */
    .stage{
      position:static; min-height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
      padding:max(3.5rem,13vh) 1.25rem 6.5rem; gap:2.2rem;
    }
    .group{position:static; transform:none; gap:1.8rem; order:1}
    .nav{order:2}
    .stage[data-open="true"] .group{transform:none}

    #cat{font-size:clamp(1.9rem,8.4vw,2.6rem); padding:.6rem}
    .name h1{font-size:clamp(1.5rem,7vw,2.1rem); letter-spacing:.2em; text-indent:.2em}
    .name .role{font-size:.7rem}
    .name .hint{font-size:.66rem}

    .nav{
      position:static; transform:none; visibility:visible; opacity:1;
      width:min(22rem,100%); height:auto; overflow:visible;
      perspective:none; padding:0; display:grid;
      border:0; font-family:"Silkscreen",monospace; font-size:1.3rem; line-height:1;
      display:grid; grid-template-rows:0fr;
      transition:grid-template-rows 320ms cubic-bezier(.2,.85,.3,1);
    }
    .stage[data-open="true"] .nav{
      transform:none; grid-template-rows:1fr; opacity:1; visibility:visible;
      transition-delay:0s;
    }
    .nav ul{overflow:hidden; min-height:0; width:auto; transform:none; border:0; padding:0;
            position:static; display:block; height:auto}
    .stage[data-open="true"] .nav ul{transform:none}
    .nav a{
      text-align:center; padding:1.15rem .5rem;   /* ~54px rows, all equal */
      border-top:1px dashed var(--ink);
    }
    .nav li:last-child a{border-bottom:1px dashed var(--ink)}
  }
</style>
</head>
<body>

<a class="skip" href="#cat">Skip to navigation</a>
<button class="mode" id="mode" type="button" aria-pressed="false"
        aria-label="Switch to dark mode">MODE</button>

<div class="stage" id="stage" data-open="false">

  <nav class="nav" id="nav" aria-label="Main">
    <ul>
      <li><a href="resume.html">RESUME</a></li>
      <li><a href="projects.html">PROJECTS</a></li>
      <li><a href="about.html">ABOUT</a></li>
      <li><a href="https://github.com/grmpyktn11">GITHUB</a></li>
      <li><a href="mailto:Khalidmoosa749@gmail.com">CONTACT</a></li>
    </ul>
  </nav>

  <div class="group" id="group">
    <button id="cat" aria-expanded="false" aria-controls="nav" aria-label="Open navigation"><span aria-hidden="true"> /\_/\
( </span><span class="eye" id="eL">&#8226;</span>w<span class="eye" id="eR">&#8226;</span><span> )
(")_(")
  c[_]</span></button>
    <div class="name">
      <h1>KHALID MOOSA</h1>
      <span class="role">SOFTWARE ENGINEER &#183; CHANTILLY, VA</span>
      <span class="hint">CLICK THE CAT</span>
    </div>
  </div>

</div>

<script>
/* ---- eyes follow the cursor. One glyph, moved on both axes, so the pupil is
        the same size whichever way it looks ---- */
var EYES = [document.getElementById('eL'), document.getElementById('eR')];
var PUPIL = '•', SHUT = '^';
var mx = null, my = null, blinking = false;

var centres = [];
function sizeNav(){
  var g = document.getElementById('group').getBoundingClientRect();
  var st = document.getElementById('stage');
  st.style.setProperty('--nav-top', g.top + 'px');
  st.style.setProperty('--nav-h', g.height + 'px');
}
sizeNav();
addEventListener('resize', sizeNav);
if(document.fonts && document.fonts.ready){ document.fonts.ready.then(sizeNav); }

function measureEyes(){
  centres = EYES.map(function(el){
    var r = el.getBoundingClientRect();
    return { x: r.left + r.width/2, y: r.top + r.height/2 };
  });
}

function setEyes(){
  EYES.forEach(function(el, i){
    if(blinking){ el.textContent = SHUT; el.style.transform = ''; return; }
    var ox = 0, oy = 0;
    if(mx !== null && centres[i]){
      var dx = mx - centres[i].x, dy = my - centres[i].y;
      var len = Math.hypot(dx, dy);
      if(len > 10){ ox = Math.round(dx/len); oy = Math.round(dy/len); }
    }
    el.textContent = PUPIL;
    el.style.transform = 'translate(' + (ox * 0.15) + 'em,' + (oy * 0.13) + 'em)';
  });
}
addEventListener('mousemove', function(e){ mx = e.clientX; my = e.clientY; setEyes(); },
                 { passive: true });
addEventListener('resize', measureEyes, { passive: true });

var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function blink(){
  blinking = true; setEyes();
  setTimeout(function(){ blinking = false; setEyes(); }, 130);
  setTimeout(blink, 3200 + Math.random()*4200);
}
measureEyes(); setEyes();
if(!reduce) setTimeout(blink, 2600);

var cat = document.getElementById('cat');
function glitch(){
  cat.classList.add('glitching');
  setTimeout(function(){ cat.classList.remove('glitching'); }, 320);
}
if(!reduce) setInterval(function(){ if(Math.random() < .5) glitch(); }, 5200);

/* ---- click the cat: the whole group slides right, then the nav unfolds ---- */
var stage = document.getElementById('stage'), nav = document.getElementById('nav');
var items = Array.prototype.slice.call(nav.querySelectorAll('a'));

function setOpen(v, moveFocus){
  stage.dataset.open = String(v);
  cat.setAttribute('aria-expanded', String(v));
  if(v) nav.removeAttribute('inert'); else nav.setAttribute('inert','');
  if(v && moveFocus) setTimeout(function(){ items[0].focus(); }, reduce ? 0 : 320);
  setTimeout(measureEyes, reduce ? 0 : 420);
}
setOpen(false, false);

var coarse = matchMedia('(pointer: coarse)').matches;
if(coarse) document.querySelector('.name .hint').textContent = 'TAP THE CAT';

cat.addEventListener('click', function(e){
  e.stopPropagation();
  if(!reduce) glitch();
  var opening = stage.dataset.open !== 'true';
  setOpen(opening, !coarse);          /* don't yank focus on a touch keyboard */
  if(opening && coarse){
    setTimeout(function(){
      nav.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'nearest' });
    }, 340);
  }
});
document.addEventListener('click', function(e){
  if(stage.dataset.open === 'true' && !nav.contains(e.target)) setOpen(false, false);
});
addEventListener('keydown', function(e){
  if(stage.dataset.open !== 'true') return;
  if(e.key === 'Escape'){ setOpen(false, false); cat.focus(); return; }
  var i = items.indexOf(document.activeElement);
  if(i === -1) return;
  if(e.key === 'ArrowDown'){ e.preventDefault(); items[(i+1) % items.length].focus(); }
  else if(e.key === 'ArrowUp'){ e.preventDefault(); items[(i-1+items.length) % items.length].focus(); }
  else if(e.key === 'Home'){ e.preventDefault(); items[0].focus(); }
  else if(e.key === 'End'){ e.preventDefault(); items[items.length-1].focus(); }
});

/* ---- light / dark ---- */
var root = document.documentElement;
try{
  var saved = localStorage.getItem('kmoosa-theme');
  if(saved) root.dataset.theme = saved;
  else if(matchMedia('(prefers-color-scheme: dark)').matches) root.dataset.theme = 'dark';
}catch(e){}
document.getElementById('mode').addEventListener('click', function(e){
  e.stopPropagation();
  root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
  try{ localStorage.setItem('kmoosa-theme', root.dataset.theme); }catch(err){}
  syncMode();
});
function syncMode(){
  var dark = root.dataset.theme === 'dark';
  var btn = document.getElementById('mode');
  btn.setAttribute('aria-pressed', String(dark));
  btn.setAttribute('aria-label', dark ? 'Switch to light mode' : 'Switch to dark mode');
  document.getElementById('tc').setAttribute('content', dark ? '#543920' : '#feeac7');
}
syncMode();
</script>
<script src="contact.js"></script>
</body>
</html>
